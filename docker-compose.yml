services:
  postgres:
    image: postgres:16-alpine
    container_name: toll-postgres
    environment:
      POSTGRES_DB: toll_management
      POSTGRES_USER: toll_admin
      POSTGRES_PASSWORD: toll_admin_dev
    ports:
      - "5432:5432"
    volumes:
      - toll_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toll_admin -d toll_management"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  toll_postgres_data:
