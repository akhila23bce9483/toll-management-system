spring:
  application:
    name: toll-management-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/toll_management}
    username: ${DATABASE_USERNAME:toll_admin}
    password: ${DATABASE_PASSWORD:toll_admin_dev}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    com.toll: INFO
